<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 유효성 검사</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 32px;
    }

    /* ── 필드 ── */
    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #5c7cfa;
    }

    input.invalid {
      border-color: #ff4d4f;
      background: #fff5f5;
    }

    input.valid {
      border-color: #52c41a;
      background: #f6ffed;
    }

    /* ── 메시지 ── */
    .msg {
      font-size: 12px;
      margin-top: 5px;
      min-height: 16px;
      transition: color 0.2s;
    }

    .msg.error   { color: #ff4d4f; }
    .msg.success { color: #52c41a; }
    .msg.info    { color: #aaa; }

    /* ── 강도 바 (비밀번호) ── */
    .strength-wrap {
      margin-top: 8px;
      display: flex;
      gap: 5px;
    }

    .strength-bar {
      height: 4px;
      flex: 1;
      border-radius: 99px;
      background: #eee;
      transition: background 0.3s;
    }

    /* ── 버튼 ── */
    .btn-join {
      width: 100%;
      padding: 13px;
      background: #5c7cfa;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-join:hover  { background: #4a69e2; }
    .btn-join:active { transform: scale(0.98); }
    .btn-join:disabled {
      background: #c5cee0;
      cursor: not-allowed;
      transform: none;
    }

    /* ── 완료 토스트 ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111;
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>회원가입</h1>
  <p class="subtitle">아래 항목을 모두 올바르게 입력해 주세요.</p>

  <!-- 아이디 -->
  <div class="field">
    <label for="uid">아이디 <span style="color:#aaa;font-weight:400">(4자 이상, 영문·숫자)</span></label>
    <input type="text" id="uid" placeholder="아이디를 입력하세요" />
    <div id="uid-msg" class="msg info"></div>
  </div>

  <!-- 비밀번호 -->
  <div class="field">
    <label for="pw">비밀번호 <span style="color:#aaa;font-weight:400">(6자 이상)</span></label>
    <input type="password" id="pw" placeholder="비밀번호를 입력하세요" />
    <div class="strength-wrap">
      <div class="strength-bar" id="s1"></div>
      <div class="strength-bar" id="s2"></div>
      <div class="strength-bar" id="s3"></div>
    </div>
    <div id="pw-msg" class="msg info"></div>
  </div>

  <!-- 비밀번호 확인 -->
  <div class="field">
    <label for="pw2">비밀번호 확인</label>
    <input type="password" id="pw2" placeholder="비밀번호를 다시 입력하세요" />
    <div id="pw2-msg" class="msg info"></div>
  </div>

  <button class="btn-join" id="join-btn" disabled>가입신청</button>
</div>

<div class="toast" id="toast">🎉 가입이 완료되었습니다!</div>

<script>
  /* ===========================
     가입 버튼 클릭 이벤트
     =========================== */

  document.querySelector('#join-btn') // → id가 join-btn인 버튼 요소를 선택한다
    .addEventListener('click', () => { // → 버튼을 클릭했을 때 실행할 이벤트를 등록한다

      const btn = document.querySelector('#join-btn'); 
      // → 다시 한 번 버튼 요소를 찾아서 btn 변수에 저장한다

      btn.disabled = true; 
      // → 버튼을 비활성화한다 (클릭 못하게 막는다)

      btn.textContent = '처리 중...'; 
      // → 버튼 안의 글자를 '처리 중...'으로 변경한다


      setTimeout(() => { 
      // → 1.5초 후에 아래 코드를 실행한다 (비동기 타이머 시작)

        const toast = document.querySelector('#toast'); 
        // → id가 toast인 요소(알림 메시지)를 선택한다

        toast.classList.add('show'); 
        // → show 클래스를 추가해서 토스트를 화면에 보이게 만든다

        btn.textContent = '가입완료 ✓'; 
        // → 버튼 글자를 '가입완료 ✓'로 변경한다

        btn.style.background = '#52c41a'; 
        // → 버튼 배경색을 초록색으로 바꾼다


        setTimeout(() => { 
        // → 다시 3초 후 실행

          toast.classList.remove('show'); 
          // → show 클래스를 제거해서 토스트를 다시 숨긴다

        }, 3000); 
        // → 3000ms = 3초

      }, 1500); 
      // → 1500ms = 1.5초

    });
</script>

</body>
</html>
