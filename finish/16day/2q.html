<!DOCTYPE html>
<html lang="ko">
<body>
    <form id="myForm">
        <input type="text" id="userName" placeholder="이름 필수">
        <button type="submit">전송</button>
    </form>

    <script>
        const form = document.querySelector('#myForm');
        const userName = document.querySelector('#userName');

        form.addEventListener('submit', (e) => {
            // 이름칸이 비어있다면?
            if (userName.value === "") {
                e.preventDefault(); // 폼 전송(새로고침)을 강제로 막음!
                alert("이름을 꼭 입력하셔야 합니다!");
            }
            // 값이 있다면 정상적으로 전송됨
        });
    </script>
</body>
</html>
