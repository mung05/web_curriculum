<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        .error-text { color: red; font-size: 12px; display: none; margin-top: -5px; margin-bottom: 10px; }
        .error-text.show { display: block; }
        .input-error { border: 2px solid red; }
    </style>
</head>
<body>
    <div id="modal" style="padding: 20px; border: 1px solid #ccc; max-width: 300px;">
        <h2>예약하기</h2>
        <form id="reservationForm">
            <input type="text" id="userName" placeholder="이름">
            <p class="error-text" id="nameError">이름을 입력해주세요.</p>

            <input type="tel" id="userPhone" placeholder="010-0000-0000">
            <p class="error-text" id="phoneError">올바른 연락처 형식이 아닙니다.</p>

            <button type="submit">예약 완료</button>
        </form>
    </div>

    <script>
        const form = document.querySelector('#reservationForm');
        const userName = document.querySelector('#userName');
        const userPhone = document.querySelector('#userPhone');
        
        const nameError = document.querySelector('#nameError');
        const phoneError = document.querySelector('#phoneError');

        const phoneRegex = /^010-\d{3,4}-\d{4}$/;

        form.addEventListener('submit', (e) => {
            let isFormValid = true;

            // 1. 이름 유효성 검사 (빈칸인지)
            if (userName.value.trim() === "") {
                nameError.classList.add('show');
                userName.classList.add('input-error');
                isFormValid = false;
            } else {
                nameError.classList.remove('show');
                userName.classList.remove('input-error');
            }

            // 2. 전화번호 정규표현식 검사
            if (!phoneRegex.test(userPhone.value)) {
                phoneError.classList.add('show');
                userPhone.classList.add('input-error');
                isFormValid = false;
            } else {
                phoneError.classList.remove('show');
                userPhone.classList.remove('input-error');
            }

            // 3. 하나라도 틀렸다면 전송 막기
            if (!isFormValid) {
                e.preventDefault(); 
            } else {
                e.preventDefault(); // 실습용(실제 전송 안되게 막음)
                alert("예약이 성공적으로 완료되었습니다! 🎊");
                // 실제 실무에서는 여기서 서버로 데이터를 보냅니다.
            }
        });
    </script>
</body>
</html>
