<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이미지 갤러리</title>
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            border-radius: 10px;
            overflow: hidden;
        }

        .img-box {
            height: 200px;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: ______;  /* (1) 이미지 비율 유지 */
        }

        .content-box {
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1>My Portfolio</h1>

    <!-- (2) 갤러리 영역 -->
    <div class="__________" id="gallery"></div>

    <script>
        // (3) 데이터 배열
        const projectData = [
            { title: '프로젝트1', category: 'Web', img: 'https://picsum.photos/id/1/400/300' },
            { title: '프로젝트2', category: 'App', img: 'https://picsum.photos/id/2/400/300' }
        ];

        // (4) 갤러리 요소 선택
        const gallery = document.__________('#gallery');

        // (5) 반복문 작성
        for (const ______ of projectData) {

            // (6) HTML 추가
            gallery.__________ += `
                <div class="gallery-item">
                    <div class="img-box">
                        <img src="${______.img}" alt="${______.title}">
                    </div>
                    <div class="content-box">
                        <h3>${______.title}</h3>
                        <p>${______.category}</p>
                    </div>
                </div>
            `;
        }
    </script>

</body>
</html>
