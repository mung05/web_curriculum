<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      /* 사이드바 스타일 */
      #sidebar {
        position: fixed;
        top: 0;
        left: -250px; /* 처음에는 화면 왼쪽 밖으로 숨김 */
        width: 250px;
        height: 100%;
        background: #333;
        color: white;
        transition: 0.3s; /* 부드러운 이동 효과 */
        z-index: 100;
      }

      /* active 클래스가 붙으면 화면 안으로 등장 */
      #sidebar.active {
        left: 0;
      }

      /* 배경 어둡게 (오버레이) */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none; /* 기본은 숨김 */
        z-index: 50;
      }

      /* 오버레이 표시 */
      #overlay.active {
        display: block;
      }
    </style>

    <button id="menu-btn">메뉴 열기</button>
    <div id="overlay"></div>
    <div id="sidebar">
      <nav>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Contact</li>
        </ul>
      </nav>
    </div>
    <script>
      const menuBtn = document.querySelector("#menu-btn");
      const sidebar = document.querySelector("#sidebar");
      const overlay = document.querySelector("#overlay");

      // 메뉴 버튼 클릭 시 실행
      menuBtn.addEventListener("click", () => {
        // 사이드바와 오버레이에 active 클래스를 토글(넣었다 빼기)
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");

        // 버튼 텍스트 변경 (상태 기반 UI 변경)
        if (sidebar.classList.contains("active")) {
          menuBtn.textContent = "메뉴 닫기";
        } else {
          menuBtn.textContent = "메뉴 열기";
        }
      });

      // 배경(오버레이) 클릭 시에도 닫히도록 설정
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
        menuBtn.textContent = "메뉴 열기";
      });
    </script>
  </body>
</html>
