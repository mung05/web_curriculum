<input id="todo-input">
<button id="add">추가</button>
<ul id="list"></ul>

<script>
/* =========================
   1. 요소 선택
   ========================= */

const input = document.querySelector("#todo-input");
// 입력창 (할 일 입력하는 곳)

const btn = document.querySelector("#add");
// 추가 버튼

const list = document.querySelector("#list");
// ul (리스트가 들어갈 공간)


/* =========================
   2. 할 일 추가 기능
   ========================= */

btn.addEventListener("click", () => {
  // 버튼을 클릭하면 실행됨

  const li = document.createElement("li");
  // createElement("li"):
  // 새로운 <li> 요소를 생성

  li.textContent = input.value;
  // 입력창에 쓴 내용을 li 안에 넣음

  list.appendChild(li);
  // appendChild():
  // ul(list)의 자식으로 li를 추가 (화면에 나타남)

  input.value = "";
  // 입력창 초기화 (다시 입력 가능하게)
});


/* =========================
   3. 리스트 클릭 시 삭제 (이벤트 위임🔥)
   ========================= */

list.addEventListener("click", (e) => {
  // ul 전체에 클릭 이벤트를 건다

  if (e.target.tagName === "LI") {
    // e.target: 실제 클릭된 요소
    // tagName: 태그 이름 (대문자로 반환됨!)

    e.target.remove();
    // remove():
    // 클릭한 li 요소를 삭제
  }
});
</script>
