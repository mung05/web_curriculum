<button id="like">🤍 좋아요</button>

<script>
/* =========================
   1. 요소 선택
   ========================= */

const like = document.querySelector("#like");
// id가 like인 버튼 요소를 선택해서 변수에 저장


/* =========================
   2. 클릭 이벤트 등록
   ========================= */

like.addEventListener("click", () => {
  // 버튼을 클릭했을 때 실행되는 함수

  
  /* =========================
     3. 클래스 토글
     ========================= */

  like.classList.toggle("active");
  // toggle("active"):
  // active 클래스가 있으면 → 제거
  // active 클래스가 없으면 → 추가
  // 👉 즉, ON / OFF 스위치 역할


  /* =========================
     4. 텍스트 변경 (삼항 연산자)
     ========================= */

  like.textContent = like.classList.contains("active")
    ? "❤️ 좋아요 취소"
    : "🤍 좋아요";

  // textContent:
  // 요소 안의 텍스트 내용을 변경

  // classList.contains("active"):
  // active 클래스가 있는지 확인 → true / false 반환

  // 삼항 연산자 구조:
  // 조건 ? 참일 때 : 거짓일 때

  // 해석:
  // active가 있으면 → "❤️ 좋아요 취소"
  // 없으면 → "🤍 좋아요"
});
</script>
