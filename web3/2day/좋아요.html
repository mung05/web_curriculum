<!DOCTYPE html>
<html lang="ko">
<body>
    <h1>게시물 좋아요</h1>
    <h2 id="like-count">좋아요: 0</h2>
    <button id="like-btn">❤️ 좋아요</button>
    <p id="msg"></p>

    <script>
        // 배열로 사용자 기록 관리
        const userLogs = []; 
        let likes = 0; // 증감 연산자용 변수

        const countDisplay = document.querySelector("#like-count");
        const msg = document.querySelector("#msg");

        document.querySelector("#like-btn").onclick = () => {
            likes++; // 증감 연산자
            countDisplay.textContent = `좋아요: ${likes}`;
            
            // 조건문을 통한 특정 이벤트 발생
            if (likes === 5) {
                msg.textContent = "축하합니다! 5번째 좋아요입니다!";
            }
        };
    </script>
</body>
</html>
