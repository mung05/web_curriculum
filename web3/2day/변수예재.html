<!DOCTYPE html>
<html lang="ko">
<body>
    <h1>연산자</h1>
    
   <script>
    // 1. 산술 연산자: 가격 계산
    let price = 3000;
    let total = price * 2; // 곱하기 연산

    // 2. 대입 연산자: 누적 금액
    let balance = 10000;
    balance -= total; // balance = balance - total 과 같음

    // 3. 비교 연산자: 재고 확인
    let stock = 0;
    if (stock <= 0) {
        console.log("품절입니다!"); // 비교 연산자(<=) 활용
    }

    // 4. 증감 연산자: 카운트
    let count = 0;
    count++; // count = 1
</script>
</body>
</html>
