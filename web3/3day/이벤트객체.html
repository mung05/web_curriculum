<!DOCTYPE html>
<!-- HTML5 문서라는 선언 -->

<html lang="ko">
<!-- 문서의 언어를 한국어로 설정 -->

<body>
    <!-- 비밀번호 입력창 (type="password"라서 입력값이 ●●●로 가려짐) -->
    <input type="password" id="pw-input" placeholder="비밀번호 8자리 이상 입력">
    
    <!-- 메시지를 출력할 영역 (초기에는 비어있음) -->
    <p id="msg"></p>

    <script>
        // id가 pw-input인 요소를 선택해서 pwInput 변수에 저장
        const pwInput = document.querySelector("#pw-input");
        
        // id가 msg인 요소를 선택해서 msg 변수에 저장
        const msg = document.querySelector("#msg");

        // input 이벤트: 사용자가 글자를 입력할 때마다 실행됨
        pwInput.addEventListener("input", (e) => {
            
            // e.target: 이벤트가 발생한 요소 (여기서는 input)
            // e.target.value: 현재 입력창에 입력된 값
            const currentVal = e.target.value;

            // 입력값 길이가 8 이상인지 검사
            if (currentVal.length >= 8) {
                // 조건 만족 시 안내 메시지 변경
                msg.textContent = "안전한 비밀번호입니다.";
                
                // 글자 색상을 초록색으로 변경
                msg.style.color = "green";
            } else {
                // 조건 불만족 시 안내 메시지 변경
                msg.textContent = "비밀번호는 8자리 이상이어야 합니다.";
                
                // 글자 색상을 빨간색으로 변경
                msg.style.color = "red";
            }
            
            // 이벤트 객체 확인용
            // e.type: 발생한 이벤트의 종류 (여기서는 "input")
            console.log("발생한 이벤트 타입:", e.type);
        });
    </script>
</body>
</html>
