<!doctype html>
<!-- HTML5 문서 선언 -->

<html lang="en">
  <head>
    <!-- 문자 인코딩 설정 -->
    <meta charset="UTF-8" />
    
    <!-- 반응형 웹 설정 (모바일 대응) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 브라우저 탭 제목 -->
    <title>Document</title>
  </head>
  <body>
    
    <!-- =========================
         📌 문의(의뢰) 폼 영역
         ========================= -->
    <form id="inquiry-form">
      
      <!-- 프로젝트 유형 선택 -->
      <!-- select는 하나의 값만 선택 가능 -->
      <select id="project-type" name="projectType">
        <!-- value 값이 실제 서버로 전달되는 데이터 -->
        <option value="web">웹사이트 제작</option>
        <option value="design">UI/UX 디자인</option>
      </select>

      <!-- =========================
           📌 라디오 버튼 (예산 선택)
           ========================= -->
      <!-- name이 같으면 → 하나만 선택 가능 (그룹 형성) -->
      <!-- value는 선택 시 서버로 전달되는 값 -->
      <input type="radio" name="budget" value="100" /> 100만원 이하
      <input type="radio" name="budget" value="500" /> 500만원 이하

      <!-- =========================
           📌 상세 내용 입력
           ========================= -->
      <!-- textarea → 여러 줄 입력 가능 -->
      <textarea id="message" name="message" placeholder="상세 내용을 적어주세요!"></textarea>

      <!-- 제출 버튼 -->
      <button type="submit">의뢰 보내기</button>
    </form>
    

    <script>
      // =========================
      // 1. 폼 요소 가져오기
      // =========================
      const form = document.querySelector("#inquiry-form");

      // =========================
      // 2. 폼 제출 이벤트 처리
      // =========================
      form.addEventListener("submit", (e) => {
        
        // 🔥 핵심: 기본 제출 동작 막기
        // form은 원래 submit 시 페이지 새로고침됨
        e.preventDefault();

        // =========================
        // 3. FormData 객체 생성
        // =========================
        // 🔥 핵심: 폼 내부의 모든 입력값을 자동으로 수집
        // (input, select, textarea 등)
        const formData = new FormData(form);

        // =========================
        // 4. 객체로 변환
        // =========================
        // 🔥 핵심: FormData → 일반 JS 객체로 변환
        // 이유: 다루기 편하게 만들기 위해
        const data = Object.fromEntries(formData);

        // =========================
        // 5. 결과 확인
        // =========================
        console.log("의뢰가 접수되었습니다:", data);

        // 예시 결과:
        // {
        //   projectType: "web",
        //   budget: "100",
        //   message: "홈페이지 제작 문의드립니다"
        // }

        // 사용자에게 알림
        alert("성공적으로 접수되었습니다!");
      });

      // =========================
      // 📌 핵심 개념 정리 (중요)
      // =========================
      // 1. name 속성의 역할
      // → FormData는 name 기준으로 데이터를 수집함
      // → name이 없으면 데이터에 포함되지 않음

      // 2. FormData
      // → form 안의 입력값을 자동으로 모아주는 객체
      // → 서버로 보낼 때 자주 사용됨

      // 3. Object.fromEntries()
      // → key-value 쌍을 일반 객체로 변환
      // → FormData를 JS 객체로 바꿀 때 필수

      // 4. 라디오 버튼
      // → 같은 name끼리 그룹
      // → 선택된 하나의 value만 들어감
    </script>
  </body>
</html>
