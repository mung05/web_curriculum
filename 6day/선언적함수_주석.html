<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <!-- HTML에서 직접 함수 호출 -->
    <button onclick="sayHello()">인사하기</button>

    <script>
      /* =========================
         1️⃣ 선언적 함수 정의
         ========================= */

      function sayHello() {
        alert("안녕하세요! 선언적 함수입니다.");
      }

      /*
         🔥 특징
         - 이름 있음
         - HTML에서도 직접 호출 가능
      */
    </script>
  </body>
</html>
