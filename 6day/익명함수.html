<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="anon-btn">익명 함수 실행</button>

    <script>
      const showLog = function () {
        console.log("이름은 없지만 변수를 통해 실행됩니다.");
      };

      document.querySelector("#anon-btn").addEventListener("click", showLog);
    </script>
  </body>
</html>
