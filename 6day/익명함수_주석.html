<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <!-- 버튼 클릭 시 이벤트로 함수 실행 -->
    <button id="anon-btn">익명 함수 실행</button>

    <script>
      /* =========================
         1️⃣ 익명 함수 정의
         ========================= */

      // 이름이 없는 함수 → 변수(showLog)에 저장
      const showLog = function () {
        console.log("이름은 없지만 변수를 통해 실행됩니다.");
      };

      /* =========================
         2️⃣ DOM 요소 선택
         ========================= */

      const btn = document.querySelector("#anon-btn");

      /* =========================
         3️⃣ 이벤트 연결
         ========================= */

      // 클릭 시 showLog 함수 실행
      btn.addEventListener("click", showLog);

      /*
         🔥 핵심 포인트
         showLog() ❌ (즉시 실행)
         showLog   ✅ (함수 전달)
      */
    </script>
  </body>
</html>
