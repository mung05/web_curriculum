<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      .field {
        margin: 20px;
      }
      .info {
        font-size: 12px;
        color: #888;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      input {
        padding: 8px;
        border: 1px solid #ccc;
      }
      input.invalid {
        border-color: red;
      }
    </style>

    <div class="field">
      <label>아이디 (4자 이상)</label><br />
      <input type="text" id="uid" placeholder="아이디 입력" />
      <div id="uid-msg" class="info"></div>
    </div>

    <div class="field">
      <button id="join-btn">가입 신청</button>
    </div>
    <script>
      // 1. 유효성 검사 로직 (선언적 함수)
      function validateId(text) {
        return text.length >= 4;
      }

      // 2. 메시지 업데이트 로직 (화살표 함수)
      const updateUI = (isValid) => {
        const msgEl = document.querySelector("#uid-msg");
        const inputEl = document.querySelector("#uid");

        if (isValid) {
          msgEl.textContent = "사용 가능한 아이디입니다.";
          msgEl.className = "info success";
          inputEl.classList.remove("invalid");
        } else {
          msgEl.textContent = "4글자 이상 입력해주세요.";
          msgEl.className = "info error";
          inputEl.classList.add("invalid");
        }
      };

      // 3. 입력 이벤트 연결
      document.querySelector("#uid").addEventListener("input", (e) => {
        const currentText = e.target.value;

        // 콜백 형태의 로직 흐름: 검사하고 결과에 따라 UI 업데이트
        const result = validateId(currentText);
        updateUI(result);
      });

      // 4. 가입 버튼 클릭 시 타이머 함수 활용
      document.querySelector("#join-btn").addEventListener("click", () => {
        alert("데이터를 검토 중입니다. 잠시만 기다려주세요...");

        setTimeout(() => {
          alert("가입이 완료되었습니다!");
        }, 1500);
      });
    </script>
  </body>
</html>
