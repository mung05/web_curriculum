<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>D타입 슬라이드(세로)</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>

    <div class="container">
        <div class="main-content">
            <div class="left">
                <header>
                    <div class="header-logo"></div>
                    <div class="navi"></div>
                    <div class="spot-menu"></div>
                </header>
            </div>
            <div class="right">
                <div class="slide">
                    <div class="slide-image">
                        <div class="slide-image-inner slide-items">
                            <a class="slide-item" href="#none1"><img src="images/slide-d-01.jpg" alt="slide1"></a>
                            <a class="slide-item" href="#none2"><img src="images/slide-d-02.jpg" alt="slide2"></a>
                            <a class="slide-item" href="#none3"><img src="images/slide-d-03.jpg" alt="slide3"></a>
                        </div>
                    </div>
                    <div class="slide-banner"></div>
                </div>
                <div class="items">
                    <div class="shortcut"></div>
                    <div class="news-gallery"></div>
                </div>
            </div>
        </div>
        <footer>
            <div class="footer-logo"></div>
            <div class="copyright"></div>
            <div class="sns"></div>
        </footer>
    </div>

    <script src="script/jquery-1.12.4.js"></script>
    <script src="script/custom2.js"></script>

</body>
</html>
