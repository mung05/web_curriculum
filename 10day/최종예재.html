<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>10일차 최종 프로젝트 - Todo List</title>
    <style>
      body {
        font-family: "Pretendard", sans-serif;
        background: #f4f7f6;
        display: flex;
        justify-content: center;
        padding-top: 50px;
      }
      .todo-app {
        width: 400px;
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #333;
      }

      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
      }
      #add-btn {
        padding: 10px 15px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      ul {
        list-style: none;
        padding: 0;
      }
      .todo-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #eee;
        animation: fadeIn 0.3s ease;
      }
      .todo-item:last-child {
        border-bottom: none;
      }
      .todo-item span {
        flex: 1;
        margin-right: 10px;
      }

      /* 삭제 버튼 스타일 */
      .del-btn {
        background: #ffeded;
        color: #ff4d4d;
        border: 1px solid #ff4d4d;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        transition: 0.2s;
      }
      .del-btn:hover {
        background: #ff4d4d;
        color: #fff;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="todo-app">
      <h2>My Todo List</h2>
      <div class="input-group">
        <input
          type="text"
          id="todo-input"
          placeholder="오늘의 할 일을 입력하세요"
        />
        <button id="add-btn">추가</button>
      </div>
      <ul id="todo-list"></ul>
    </div>

    <script>
      // 1. 필요한 문서 객체 가져오기
      const input = document.querySelector("#todo-input");
      const addBtn = document.querySelector("#add-btn");
      const todoList = document.querySelector("#todo-list");

      // [기능 1] 할 일 추가 함수
      function addTodo() {
        const text = input.value.trim();

        if (text === "") {
          alert("내용을 입력해주세요!");
          return;
        }

        // 새로운 li 요소 생성 (p.319 문서 객체 생성 참고)
        const li = document.createElement("li");
        li.classList.add("todo-item");

        // 템플릿 리터럴을 이용한 내부 구조 작성
        li.innerHTML = `
        <span>${text}</span>
        <button class="del-btn">삭제</button>
    `;

        // ul 리스트에 추가
        todoList.appendChild(li);

        // 입력창 초기화 및 포커스
        input.value = "";
        input.focus();
      }

      // [기능 2] 할 일 삭제 기능 (이벤트 위임 활용 패턴)
      // 개별 버튼이 아닌 부모인 todoList에 이벤트를 걸어 효율성 증대
      todoList.addEventListener("click", function (event) {
        // 클릭된 요소가 삭제 버튼인지 확인 (p.336 이벤트 발생 객체 활용)
        if (event.target.classList.contains("del-btn")) {
          // 탐색: 클릭된 버튼에서 가장 가까운 .todo-item(li) 찾기
          const targetLi = event.target.closest(".todo-item");

          // 제거: 해당 요소 삭제 (p.322 문서 객체 제거)
          if (targetLi) {
            targetLi.remove();
            console.log("항목이 성공적으로 삭제되었습니다.");
          }
        }
      });

      // 버튼 클릭 및 엔터 키 지원
      addBtn.addEventListener("click", addTodo);
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addTodo();
      });
    </script>
  </body>
</html>
